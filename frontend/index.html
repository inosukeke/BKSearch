<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BKSearch — Tìm kiếm tài liệu HUST</title>
    <meta name="description" content="Tìm kiếm tài liệu HUST — demo Information Retrieval" />
    <script>
      // Áp theme sớm để tránh nháy (FOUC).
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
