# Hạ tầng nền cho BKSearch (S0.2): OpenSearch + Dashboards + PostgreSQL + Redis.
# Chạy:  cd deploy && cp .env.example .env && docker compose up -d
# Dùng cho DEV: đã TẮT security của OpenSearch (không TLS/auth) cho tiện.

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: bksearch-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: bksearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s

  postgres:
    image: postgres:16
    container_name: bksearch-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bksearch}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bksearch_dev}
      - POSTGRES_DB=${POSTGRES_DB:-bksearch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tự áp schema khi volume còn trống (fresh init). Volume đã có dữ liệu thì áp thủ công (xem deploy/postgres/schema.sql).
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bksearch}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bksearch-redis
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Embedding + rerank service (Phase 2, S2.1/S2.5). CPU-only; model nạp lazy lần gọi đầu.
  embedding:
    build: ../embedding-service
    container_name: bksearch-embedding
    environment:
      - EMBED_MODEL=${EMBED_MODEL:-bkai-foundation-models/vietnamese-bi-encoder}
      - EMBED_DIMS=${EMBED_DIMS:-768}
      - EMBED_BATCH=${EMBED_BATCH:-32}
      - RERANK_MODEL=${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      # EMBED_FAKE=1 để chạy KHÔNG cần tải model (smoke/dev nhanh; vector/điểm là giả).
      - EMBED_FAKE=${EMBED_FAKE:-0}
    volumes:
      # Cache model HuggingFace để không tải lại mỗi lần khởi động.
      - embedding-models:/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s

  # Monitoring (S4.2) — chỉ bật khi cần: docker compose --profile monitoring up -d
  # Prometheus scrape /metrics của Query Service (chạy trên host:7070).
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bksearch-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Cho phép container Prometheus gọi về Query Service chạy trên HOST (Linux).
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bksearch-grafana
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  opensearch-data:
  postgres-data:
  redis-data:
  embedding-models:
  prometheus-data:
  grafana-data:
